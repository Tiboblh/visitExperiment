<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>You came from...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #101010;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: min(90%, 700px);
            text-align: center;
        }

        h1 {
            font-size: clamp(35px, 7vw, 60px);
            margin: 0 0 25px;
        }

        .from {
            color: #8ab4ff;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        p {
            color: #c0c0c0;
            font-size: 18px;
            line-height: 1.6;
        }

        strong {
            color: white;
        }

        .counter {
            display: inline-block;

            margin-top: 30px;
            padding: 20px 30px;

            background: #181818;
            border: 1px solid #292929;
            border-radius: 15px;

            color: #aaa;
        }

        .number {
            display: block;

            margin-bottom: 5px;

            color: #8ab4ff;
            font-size: 38px;
            font-weight: bold;
        }

        .loading {
            color: #666;
        }
    </style>
</head>

<body>

<main class="container">

    <h1>
        You came from
        <span class="from" id="from">...</span>
    </h1>

    <p>
        I am <strong>tiboblh</strong> and I'm doing an experiment.
        <br>
        I'm testing every way I can think of to get people to go to a website.
    </p>

    <div class="counter">
        <span class="number loading" id="count">...</span>
        person(s) came from the same method.
    </div>

</main>


<script>

const API_URL =
    "https://script.google.com/macros/s/AKfycbxNtRj1zVOSzhHT3ge2rtMiQT-3cK2vjbicMWRK1PExx8JwV_LQNuu5LRbC-QttASXUTg/exec";


/*
 * Get ?from=
 */

const params = new URLSearchParams(
    window.location.search
);

const from = (
    params.get("from") || "unknown"
).toLowerCase();


document.getElementById("from").textContent = from;


/*
 * Listen for the response from Apps Script.
 */

window.addEventListener("message", function(event) {

    if (!event.data) {
        return;
    }

    if (event.data.type !== "tiboblh-stats") {
        return;
    }

    const data = event.data.data;

    if (!data || !data.success) {
        document.getElementById("count").textContent = "?";
        return;
    }

    const count = document.getElementById("count");

    count.textContent = data.count;
    count.classList.remove("loading");

});


/*
 * ADD
 *
 * Image request doesn't care about CORS.
 */

const addRequest = new Image();

addRequest.src =
    API_URL +
    "?action=add&from=" +
    encodeURIComponent(from);


/*
 * STAT
 *
 * We load Apps Script in an iframe.
 * Apps Script sends the result back using postMessage().
 */

const iframe = document.createElement("iframe");

iframe.style.display = "none";

iframe.src =
    API_URL +
    "?action=stat&from=" +
    encodeURIComponent(from);

document.body.appendChild(iframe);

</script>

</body>
</html>
